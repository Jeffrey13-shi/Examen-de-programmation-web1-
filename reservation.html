    <div class="reserve">

      <label>Nom <input required id="nom" placeholder="Votre nom" /></label>
      <label>Téléphone <input required id="tel" placeholder="+243..." /></label>
      <label>Date <input type="date" required id="date" /></label>
      <label>Heure <input type="time" required id="heure" step="1800" /></label>
      <label
        >place
        <select id="pers">
          <option>1</option>
          <option selected>2</option>
          <option>3</option>
          <option>4</option>
          <option>5</option>
          <option>6</option>
        </select>
      </label>
      <button>Confirmer</button>
    </form>
    <div id="ok" class="ok"></div>
  </body>
